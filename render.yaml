services:
  # 1. Backend (FastAPI)
  - type: web
    name: movie-rec-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: TMDB_API_KEY
        sync: false # User must set this in dashboard
      - key: PYTHON_VERSION
        value: 3.11.0

  # 2. Frontend (Streamlit)
  - type: web
    name: movie-rec-frontend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: API_BASE
        fromService:
          type: web
          name: movie-rec-api
          property: host
      - key: PYTHON_VERSION
        value: 3.11.0
